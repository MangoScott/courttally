<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CourtTally review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#111; --fg:#eee; --mut:#888; --acc:#ffd54a; --a:#4caf50; --b:#42a5f5; --drop:#555; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  .wrap { display:grid; grid-template-columns: 1fr 360px; height:100vh; }
  video { width:100%; max-height:70vh; background:#000; }
  .main { padding:12px; display:flex; flex-direction:column; gap:8px; overflow:auto; }
  .main > * { flex-shrink:0; }
  .side { border-left:1px solid #333; overflow:auto; }
  .pt { padding:8px 12px; border-bottom:1px solid #222; cursor:pointer; display:flex; gap:8px; align-items:center; }
  .pt.cur { background:#222; outline:1px solid var(--acc); }
  .pt.drop { color:var(--drop); text-decoration:line-through; }
  .w { font-weight:700; min-width:18px; text-align:center; border-radius:3px; padding:0 4px; }
  .w.A { background:var(--a); color:#000 } .w.B { background:var(--b); color:#000 }
  .score { font-size:22px; font-variant-numeric:tabular-nums; }
  .help { color:var(--mut); font-size:12px; }
  kbd { background:#333; border-radius:3px; padding:1px 5px; font-family:monospace; }
  button { background:#333; color:var(--fg); border:0; padding:8px 12px; border-radius:4px; cursor:pointer; }
  button.primary { background:var(--acc); color:#000; font-weight:700; }
  .bar { position:relative; height:28px; background:#222; border-radius:4px; overflow:hidden; cursor:pointer; }
  .bar .seg { position:absolute; top:0; bottom:0; background:var(--a); opacity:.7; }
  .bar .seg.drop { background:var(--drop); }
  .bar .seg.cur { outline:2px solid var(--acc); }
  .bar .head { position:absolute; top:0; bottom:0; width:2px; background:#fff; }
  input[type=text] { background:#222; color:var(--fg); border:1px solid #444; padding:4px 6px; width:100%; }
  @media (max-width: 800px) { .wrap { grid-template-columns:1fr; } .side { border:0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <video id="v" src="__VIDEO__" controls preload="metadata"></video>
    <div class="bar" id="bar"></div>
    <div class="score" id="score"></div>
    <div id="cur"></div>
    <div><input type="text" id="label" placeholder="label for this point (e.g. ace, great rally) — Enter to save"></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap">
      <button onclick="prev()">◀ prev (J)</button>
      <button onclick="next()">next (K) ▶</button>
      <button onclick="replay()">replay point (R)</button>
      <button onclick="win('A')">A won (A)</button>
      <button onclick="win('B')">B won (B)</button>
      <button onclick="toggle()">keep/drop (X)</button>
      <button onclick="serve()">toggle server (S)</button>
      <button class="primary" onclick="exportJson()">Export points.edited.json (E)</button>
    </div>
    <div class="help">
      <kbd>space</kbd> play/pause · <kbd>J</kbd>/<kbd>K</kbd> prev/next point · <kbd>R</kbd> replay ·
      <kbd>A</kbd>/<kbd>B</kbd> winner (A = near player, B = far) · <kbd>X</kbd> keep/drop ·
      <kbd>[</kbd>/<kbd>]</kbd> start −/+0.5 s · <kbd>;</kbd>/<kbd>'</kbd> end −/+0.5 s ·
      <kbd>N</kbd> new point at playhead · <kbd>E</kbd> export.
      Score assumes A serves first; press <kbd>S</kbd> on the first point to flip. Edits autosave to this browser.
    </div>
  </div>
  <div class="side" id="list"></div>
</div>
<script>
const DATA = __DATA__;
const KEY = "courttally:" + DATA.clip;
let pts = (function(){ try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e){} return DATA.points; })();
let cur = 0, stopAt = null;
const v = document.getElementById("v");

function save(){ try { localStorage.setItem(KEY, JSON.stringify(pts)); } catch(e){} render(); }
function fmt(s){ const m = Math.floor(s/60); return m + ":" + (s - m*60).toFixed(1).padStart(4,"0"); }

// --- tennis scoring (mirrors courttally/score.py) ---
function scoreUpTo(i){
  const S = {sets:[], g:[0,0], p:[0,0], tb:false, winner:null};
  const names = ["0","15","30","40"];
  function endGame(w){ S.g[w]++; S.p=[0,0]; S.tb=false; const [a,b]=S.g;
    if ((Math.max(a,b)>=6 && Math.abs(a-b)>=2) || Math.max(a,b)==7){ S.sets.push([a,b]); S.g=[0,0];
      const sa=S.sets.filter(s=>s[0]>s[1]).length, sb=S.sets.length-sa; if(sa==2)S.winner="A"; if(sb==2)S.winner="B"; }
    else if (a==6 && b==6) S.tb=true; }
  for (let k=0;k<=i;k++){ const p=pts[k]; if(!p.keep||!p.winner||S.winner) continue;
    const w=p.winner=="A"?0:1, o=1-w; S.p[w]++;
    if (S.tb){ if(S.p[w]>=7 && S.p[w]-S.p[o]>=2) endGame(w); }
    else if (S.p[w]>=4 && S.p[w]-S.p[o]>=2) endGame(w); }
  let game; const [a,b]=S.p;
  if (S.tb) game=a+"-"+b; else if (a>=3&&b>=3) game=(a==b)?"Deuce":(a>b?"Ad A":"Ad B"); else game=names[Math.min(a,3)]+"-"+names[Math.min(b,3)];
  return S.sets.map(s=>s.join("-")).concat([S.g.join("-")]).join("  ") + "  (" + game + ")" + (S.winner?"  — "+S.winner+" wins":"");
}

function render(){
  const list = document.getElementById("list"); list.innerHTML = "";
  pts.forEach((p,i)=>{ const d=document.createElement("div");
    d.className="pt"+(i==cur?" cur":"")+(p.keep?"":" drop");
    d.innerHTML = `<span style="min-width:28px;color:#888">${i+1}</span><span class="w ${p.winner||""}">${p.winner||"·"}</span>` +
      `<span>${fmt(p.start_s)} – ${fmt(p.end_s)} <span style="color:#888">(${(p.end_s-p.start_s).toFixed(1)}s)</span>` +
      (p.serve?` <span style="color:#888">srv ${p.serve}</span>`:"") + (p.label?`<br><em>${p.label}</em>`:"") + `</span>`;
    d.onclick=()=>go(i); list.appendChild(d); });
  const bar=document.getElementById("bar"); bar.innerHTML="";
  pts.forEach((p,i)=>{ const s=document.createElement("div"); s.className="seg"+(p.keep?"":" drop")+(i==cur?" cur":"");
    s.style.left=(100*p.start_s/DATA.duration_s)+"%"; s.style.width=(100*(p.end_s-p.start_s)/DATA.duration_s)+"%"; s.onclick=(e)=>{e.stopPropagation();go(i)}; bar.appendChild(s); });
  const h=document.createElement("div"); h.className="head"; h.id="head"; bar.appendChild(h);
  const p=pts[cur]; const kept=pts.filter(q=>q.keep);
  document.getElementById("cur").textContent = p ? `Point ${cur+1}/${pts.length} · ${fmt(p.start_s)}–${fmt(p.end_s)} · ${kept.length} kept · ` +
    `play ${fmt(kept.reduce((a,q)=>a+q.end_s-q.start_s,0))} of ${fmt(DATA.duration_s)}` : "no points";
  document.getElementById("score").textContent = "Score: " + scoreUpTo(cur);
  document.getElementById("label").value = p ? (p.label||"") : "";
  const el=list.children[cur]; if (el) el.scrollIntoView({block:"nearest"});
}
function go(i){ if(!pts.length) return; cur=(i+pts.length)%pts.length; replay(); render(); }
function prev(){ go(cur-1); } function next(){ go(cur+1); }
function replay(){ const p=pts[cur]; if(!p) return; v.currentTime=p.start_s; stopAt=p.end_s; v.play(); }
function win(w){ const p=pts[cur]; if(!p) return; p.winner=(p.winner==w)?null:w; save(); }
function toggle(){ const p=pts[cur]; if(!p) return; p.keep=!p.keep; save(); }
function serve(){ const p=pts[cur]; if(!p) return; p.serve=p.serve=="A"?"B":(p.serve=="B"?null:"A"); save(); }
function nudge(field, d){ const p=pts[cur]; if(!p) return; p[field]=Math.max(0,Math.min(DATA.duration_s,+(p[field]+d).toFixed(3))); if(p.end_s<=p.start_s+0.2)p.end_s=p.start_s+0.2; save(); }
function newPoint(){ const t=v.currentTime; const p={index:pts.length,start_s:+t.toFixed(3),end_s:+Math.min(DATA.duration_s,t+5).toFixed(3),winner:null,keep:true,serve:null,label:"",tags:[]};
  pts.push(p); pts.sort((a,b)=>a.start_s-b.start_s); pts.forEach((q,i)=>q.index=i); cur=pts.indexOf(p); save(); }
function exportJson(){ const out={clip:DATA.clip,duration_s:DATA.duration_s,fps:DATA.fps,points:pts};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="points.edited.json"; a.click(); }
v.addEventListener("timeupdate",()=>{ if(stopAt!=null && v.currentTime>=stopAt){ v.pause(); stopAt=null; }
  const h=document.getElementById("head"); if(h) h.style.left=(100*v.currentTime/DATA.duration_s)+"%"; });
document.getElementById("bar").addEventListener("click",(e)=>{ const r=e.currentTarget.getBoundingClientRect(); v.currentTime=DATA.duration_s*(e.clientX-r.left)/r.width; stopAt=null; });
document.getElementById("label").addEventListener("keydown",(e)=>{ if(e.key=="Enter"){ pts[cur].label=e.target.value; save(); e.target.blur(); } e.stopPropagation(); });
document.addEventListener("keydown",(e)=>{ if(e.target.tagName=="INPUT") return;
  const k=e.key.toLowerCase();
  if(k==" "){ e.preventDefault(); stopAt=null; v.paused?v.play():v.pause(); }
  else if(k=="j") prev(); else if(k=="k") next(); else if(k=="r") replay();
  else if(k=="a") win("A"); else if(k=="b") win("B"); else if(k=="x") toggle(); else if(k=="s") serve();
  else if(k=="[") nudge("start_s",-0.5); else if(k=="]") nudge("start_s",0.5);
  else if(k==";") nudge("end_s",-0.5); else if(k=="'") nudge("end_s",0.5);
  else if(k=="n") newPoint(); else if(k=="e") exportJson(); });
render();
</script>
</body>
</html>
